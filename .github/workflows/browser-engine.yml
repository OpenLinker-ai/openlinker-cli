name: Browser engine

on:
  pull_request:
    paths:
      - "browser-engine/**"
      - "pkg/browserprotocol/**"
      - "pkg/browserruntime/**"
      - "pkg/egressgateway/**"
      - "pkg/netpolicy/**"
      - ".github/workflows/browser-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: browser-engine/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
      - name: Install the pinned Browser engine graph
        working-directory: browser-engine
        run: npm ci --ignore-scripts
      - name: Type-check and test the Browser engine
        working-directory: browser-engine
        run: npm run lint && npm test
      - name: Test the Go supervisor contract with the race detector
        run: go test -race ./pkg/browserprotocol ./pkg/browserruntime
