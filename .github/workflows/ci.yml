name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: GOWORK=off go test ./...

      - name: Verify nested modules
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 2 -name go.mod -not -path './.git/*' -print | sort | while IFS= read -r gomod; do
            mod="$(dirname "${gomod}")"
            (cd "${mod}" && GOWORK=off go test ./...)
          done

      - name: Build
        run: |
          GOWORK=off go build -mod=readonly -buildvcs=true -trimpath -ldflags="-s -w" ./cmd/openlinker
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 GOWORK=off go build -mod=readonly -buildvcs=true -trimpath -o "${RUNNER_TEMP}/openlinker.exe" ./cmd/openlinker

      - name: Verify immutable Plugin module dependency
        run: |
          test "$(GOWORK=off go list -m -f '{{.Replace}}' github.com/OpenLinker-ai/openlinker-plugin)" = '<nil>'
          GOWORK=off go mod verify
