name: Provider images

on:
  pull_request:
    paths:
      - "Dockerfile.providers"
      - "Dockerfile.browser"
      - "browser-engine/**"
      - "deploy/**"
      - "cmd/openlinker-egress-gateway/**"
      - "cmd/openlinker-browser-runtime/**"
      - "cmd/openlinker-provider-launcher/**"
      - "cmd/openlinker-runtime-entrypoint/**"
      - "pkg/agent/**"
      - "pkg/agentexec/**"
      - "pkg/browserprotocol/**"
      - "pkg/browserprofile/**"
      - "pkg/browserruntime/**"
      - "pkg/egressgateway/**"
      - "pkg/netpolicy/**"
      - "test/browser-image/**"
      - "test/release-images/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  browser-acceptance:
    name: Real Chromium no-bypass acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Self-test release evidence rejection
        run: ./test/release-images/verify.test.sh
      - name: Run production Browser and Egress images
        run: ./test/browser-image/run.sh

  images:
    needs: browser-acceptance
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: codex
            image: openlinker-agent-codex
            dockerfile: Dockerfile.providers
          - target: claude
            image: openlinker-agent-claude
            dockerfile: Dockerfile.providers
          - target: egress
            image: openlinker-egress-gateway
            dockerfile: Dockerfile.providers
          - target: browser
            image: openlinker-browser-runtime
            dockerfile: Dockerfile.browser
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/openlinker-ai/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: OPENLINKER_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=providers-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=providers-${{ matrix.target }}
          sbom: true
          provenance: mode=max

  verify-release-evidence:
    name: Verify release platforms, SBOM, and provenance
    if: github.ref_type == 'tag'
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the published release evidence
        env:
          OPENLINKER_RELEASE_EVIDENCE_DIR: release-evidence
        run: |
          ./test/release-images/verify.sh \
            ghcr.io/openlinker-ai \
            "${GITHUB_REF_NAME}"
      - name: Upload the inspected release evidence
        uses: actions/upload-artifact@v7
        with:
          name: provider-release-evidence-${{ github.ref_name }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
