services:
  openlinker-browser-runtime:
    build:
      context: ..
      dockerfile: Dockerfile.browser.native-chrome
      args:
        OPENLINKER_BROWSER_BASE: ${OPENLINKER_NATIVE_CHROME_BASE:?set OPENLINKER_NATIVE_CHROME_BASE to an immutable image digest}
        OPENLINKER_CHROME_ARTIFACT: ${OPENLINKER_NATIVE_CHROME_ARTIFACT:-chrome.tar}
        OPENLINKER_CHROME_LOCK: ${OPENLINKER_NATIVE_CHROME_LOCK:-chrome.lock.json}
        OPENLINKER_CHROME_VERSION: ${OPENLINKER_NATIVE_CHROME_VERSION:?set OPENLINKER_NATIVE_CHROME_VERSION}
        OPENLINKER_EXTENSION_ARTIFACT: ${OPENLINKER_NATIVE_CHROME_EXTENSION_ARTIFACT:-native-chrome-extension.tar}
        OPENLINKER_EXTENSION_LOCK: ${OPENLINKER_NATIVE_CHROME_EXTENSION_LOCK:-native-chrome-extension.lock.json}
        OPENLINKER_EXTENSION_ID: ${OPENLINKER_NATIVE_CHROME_EXTENSION_ID:-hehggadaopoacecdllhhajmbjkdcmajg}
        OPENLINKER_EXTENSION_VERSION: ${OPENLINKER_NATIVE_CHROME_EXTENSION_VERSION:?set OPENLINKER_NATIVE_CHROME_EXTENSION_VERSION}
        OPENLINKER_NATIVE_CHROME_PROFILE_GENERATION: ${OPENLINKER_NATIVE_CHROME_PROFILE_GENERATION:?set OPENLINKER_NATIVE_CHROME_PROFILE_GENERATION}
    image: ${OPENLINKER_NATIVE_CHROME_IMAGE:-openlinker-browser-runtime:native-chrome-dev}
