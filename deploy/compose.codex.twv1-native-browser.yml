services:
  openlinker-egress-gateway:
    image: ${OPENLINKER_TWV1_EGRESS_IMAGE:?set immutable twv1 egress image}

  openlinker-agent-codex:
    image: ${OPENLINKER_TWV1_CODEX_IMAGE:?set immutable twv1 Codex image}
    environment:
      OPENLINKER_AGENT_TOKEN: ""
      OPENLINKER_AGENT_TOKEN_FILE: /run/openlinker-secrets/agent-token
      CODEX_API_KEY: ""
      CODEX_API_KEY_FILE: /run/openlinker-secrets/codex-api-key
      OPENLINKER_AGENT_SESSION_REUSE: "true"
      OPENLINKER_AGENT_TRANSPORT: ws
      OPENLINKER_BROWSER_CLIENT_MODE: openlinker-native-chrome
    volumes:
      - type: bind
        source: ${OPENLINKER_TWV1_AGENT_TOKEN_FILE:?set agent token secret file}
        target: /run/openlinker-secrets/agent-token
        read_only: true
      - type: bind
        source: ${OPENLINKER_TWV1_CODEX_API_KEY_FILE:?set Codex API key secret file}
        target: /run/openlinker-secrets/codex-api-key
        read_only: true

  openlinker-browser-runtime:
    image: ${OPENLINKER_TWV1_BROWSER_IMAGE:?set immutable twv1 Browser image}
